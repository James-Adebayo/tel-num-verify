<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./assets/css/style.css">
    <title>Document</title>
</head>
<body>
    <form>
        <h2>Tel-Number Info</h2>
        <label for="number">Phone Number</label>
        <input type="tel" name="number" id="number" required>
        <button type="submit" id="submit">Search Number</button>
    </form>

    <div id="response">No data </div>
</body>

<script>
    const form = document.querySelector('form');
    const responsecontainer = document.getElementById("response");
    const submitBtn = document.getElementById('submit');
    form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const phonenumber = document.getElementById('number').value;
        submitBtn.disabled = true;
        submitBtn.textContent = "Verifying...";
        try {
            const response = await fetch("/validate", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({number: phonenumber})
            })

            const data = await response.json();
            const {carrier, country_code, country_name, country_prefix, international_format, line_type,local_format, location,number, valid} = data.data;
            responsecontainer.innerHTML =   `
                <table border="1" cellpadding="6" cellspacing="0">
                <thead>
                    <tr>
                    <th>Carrier</th>
                    <th>Country Code</th>
                    <th>Country Name</th>
                    <th>Country Prefix</th>
                    <th>International Format</th>
                    <th>Line Type</th>
                    <th>Local Format</th>
                    <th>Location</th>
                    <th>Number</th>
                    <th>Valid</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                    <td>${carrier}</td>
                    <td>${country_code}</td>
                    <td>${country_name}</td>
                    <td>${country_prefix}</td>
                    <td>${international_format}</td>
                    <td>${line_type}</td>
                    <td>${local_format}</td>
                    <td>${location}</td>
                    <td>${number}</td>
                    <td>${valid}</td>
                    </tr>
                </tbody>
                </table>
            `
        }catch(err){
            responsecontainer.textContent = "network error"
            console.log(err)
        }finally{
            submitBtn.disabled = false;
            submitBtn.textContent = "Search number";
        }
    })
</script>
</html>
